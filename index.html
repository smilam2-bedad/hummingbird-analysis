<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummingbird Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0f1a2e;
    --navy-mid: #1a2a45;
    --navy-light: #243656;
    --teal: #2dd4a8;
    --teal-dim: rgba(45, 212, 168, 0.15);
    --teal-glow: rgba(45, 212, 168, 0.3);
    --slate: #94a3b8;
    --white: #f1f5f9;
    --red: #f87171;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Animated background grid ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(45,212,168,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,168,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridShift 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridShift {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(60px, 60px); }
  }

  /* ── Glow orb ── */
  body::after {
    content: '';
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45,212,168,0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
  }

  .gate-container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: fadeUp 0.8s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--teal), #1a9a7a);
    margin-bottom: 28px;
    box-shadow: 0 8px 32px rgba(45,212,168,0.2);
  }

  .logo-mark svg {
    width: 34px;
    height: 34px;
    fill: var(--navy);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--slate);
    font-size: 0.9rem;
    font-weight: 300;
    margin-bottom: 36px;
  }

  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    background: var(--navy-mid);
    border: 1.5px solid var(--navy-light);
    border-radius: 10px;
    color: var(--white);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .input-group input::placeholder {
    color: #4a5568;
  }

  .input-group input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-dim);
  }

  .input-group .toggle-vis {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--slate);
    cursor: pointer;
    padding: 4px;
    display: flex;
    transition: color 0.2s;
  }

  .input-group .toggle-vis:hover { color: var(--teal); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--teal), #1a9a7a);
    color: var(--navy);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.25s;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(45,212,168,0.3);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .error-msg {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 14px;
    min-height: 1.2em;
    transition: opacity 0.3s;
  }

  .footer-note {
    margin-top: 48px;
    font-size: 0.75rem;
    color: #3d4f6e;
    letter-spacing: 0.04em;
  }

  /* Shake animation on wrong password */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease-out; }
</style>
</head>
<body>

<div class="gate-container">
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
    </svg>
  </div>

  <h1>Hummingbird Ventures</h1>
  <p class="subtitle"> Higher Education Analysis Platform</p>

  <div class="input-group">
    <input type="password" id="pw" placeholder="Enter access code" autocomplete="off" autofocus />
    <button class="toggle-vis" onclick="toggleVis()" tabindex="-1" aria-label="Toggle password visibility">
      <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <button class="submit-btn" onclick="tryAuth()">Access Platform</button>

  <p class="error-msg" id="error"></p>

  <p class="footer-note">INTERNAL USE ONLY</p>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════════════
// To set or change the password:
//   1. Open a browser console (F12)
//   2. Run:  await digestHex("your-new-password")
//   3. Copy the hex string it returns
//   4. Paste it into HASH below
//
// Current password: hello
// ═══════════════════════════════════════════════════════════════════

const HASH = '2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824';

const TOKEN_KEY = 'hv_auth';

// Read redirect from URL param, whitelist allowed pages, default to map
const ALLOWED = ['map.html','clusters.html','summary.html','scatter3d.html','news.html'];
const param = new URLSearchParams(window.location.search).get('redirect');
const LANDING = (param && ALLOWED.includes(param)) ? param : 'map.html';

// ═══════════════════════════════════════════════════════════════════

async function digestHex(text) {
  const buf = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(text));
  return [...new Uint8Array(buf)]
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

// Check if already authed — skip gate entirely
if (localStorage.getItem(TOKEN_KEY) === HASH) {
  window.location.replace(LANDING);
}

async function tryAuth() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;

  const hash = await digestHex(pw);

  if (hash === HASH) {
    localStorage.setItem(TOKEN_KEY, HASH);
    window.location.replace(LANDING);
  } else {
    const err = document.getElementById('error');
    const container = document.querySelector('.gate-container');
    err.textContent = 'Invalid access code';
    container.classList.remove('shake');
    void container.offsetWidth;
    container.classList.add('shake');
    document.getElementById('pw').select();
  }
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryAuth();
});

function toggleVis() {
  const inp = document.getElementById('pw');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  inp.focus();
}
</script>
</body>
</html>
